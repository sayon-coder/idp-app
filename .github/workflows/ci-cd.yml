name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          cd app/backend
          npm install

      - name: Run tests
        run: |
          cd app/backend
          npm test

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: sayon-coder/idp-gitops
          token: ${{ secrets.GITOPS_PAT }}
          path: idp-gitops

      - name: Update image tag in GitOps repo
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          sed -i "s|tag: .*|tag: \"${SHORT_SHA}\"|" idp-gitops/charts/idp-app/values.yaml
          cat idp-gitops/charts/idp-app/values.yaml

      - name: Commit and push to GitOps repo
        run: |
          cd idp-gitops
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add charts/idp-app/values.yaml
          git commit -m "ci: update image tag to ${{ github.sha }}"
          git push
